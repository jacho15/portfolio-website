<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- mask / face silhouette, profile facing right, pointed chin lower-left -->
  <path d="M40 30
    C50 32 55 40 52 48
    C50 54 43 57 36 55
    C33 54 31 52 30 50
    L22 56 L27 47
    C24 43 24 37 28 33
    C31 30 36 29 40 30 Z"
    fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- white flame eye -->
  <path d="M45 40
    C43 42 44 44 42 46
    C44 45 46 44 46 42
    C47 44 46 47 44 48
    C48 47 50 44 49 41
    C48 39 46 39 45 40 Z"
    fill="#FFFFFF"/>
  <!-- top hat, tilted -->
  <g transform="rotate(18 34 26)">
    <!-- brim -->
    <ellipse cx="32" cy="28" rx="19" ry="4.5" fill="#E60012" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- crown -->
    <path d="M22 26 L20 6 C20 4 24 3 32 3 C40 3 44 4 44 6 L42 26 Z"
      fill="#E60012" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- band -->
    <path d="M21.4 20 L42.6 20 L42 26 L22 26 Z" fill="#0A0A0A"/>
  </g>
</svg>
